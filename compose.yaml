name: croquis3r

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      THREER_PRICING_ENABLED: ${THREER_PRICING_ENABLED:-0}
      THREER_SQL_HOST: ${THREER_SQL_HOST:-}
      THREER_SQL_PORT: ${THREER_SQL_PORT:-1433}
      THREER_SQL_DATABASE: ${THREER_SQL_DATABASE:-ALMACEN_3R}
      THREER_SQL_SCHEMA: ${THREER_SQL_SCHEMA:-ALMACEN_3R}
      THREER_SQL_USER: ${THREER_SQL_USER:-}
      THREER_SQL_PASSWORD: ${THREER_SQL_PASSWORD:-}
      THREER_SQL_PRICE_LEVEL: ${THREER_SQL_PRICE_LEVEL:-GENERAL}
      THREER_SQL_CURRENCY: ${THREER_SQL_CURRENCY:-L}
      THREER_SQL_PRICE_INCLUDES_TAX: ${THREER_SQL_PRICE_INCLUDES_TAX:-1}
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-croquis3r}
      POSTGRES_USER: ${POSTGRES_USER:-croquis3r_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "127.0.0.1:${APP_PORT:-8013}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      backend: {}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-croquis3r}
      POSTGRES_USER: ${POSTGRES_USER:-croquis3r_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
volumes:
  postgres_data:
networks:
  backend:
    internal: true
